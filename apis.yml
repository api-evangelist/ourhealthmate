name: OurHealthMate
description: >-
  OurHealthMate was an Indian digital health-tech startup (a 500 Global / 500
  Startups portfolio company) that let non-resident Indians book medical
  appointments, health checkups, and lab tests at hospitals and clinics across
  India on behalf of family members. The ourhealthmate.com domain now permanently
  redirects (HTTP 301) to myfitnesswallet.com, a corporate wellness platform
  operating in India and Singapore that delivers employee wellness programs,
  telemedicine, health risk assessments, health screenings, and mental-wellness
  services to enterprise clients. No public API, developer portal, documentation,
  or well-known discovery surface could be found for either brand as of this
  enrichment pass; this remains an identity-only company profile in the API
  Evangelist network with no API artifacts to harvest.
